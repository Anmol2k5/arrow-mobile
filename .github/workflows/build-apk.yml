name: Build Arrow Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.10.2'

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v -keystore app/release-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
          -alias arrow -storepass android -keypass android \
          -dname "CN=Arrow Mobile, OU=Dev, O=Arrow, L=City, ST=State, C=US"

    - name: Build Release APK
      run: |
        if ! gradle assembleRelease --no-daemon -p . -Pandroid.storePassword=android -Pandroid.keyAlias=arrow -Pandroid.keyPassword=android; then
          echo "Build failed!"
          exit 1
        fi

    - name: Verify APK exists
      run: |
        if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "APK file not found!"
          exit 1
        fi
        echo "APK size: $(du -h app/build/outputs/apk/release/app-release.apk | cut -f1)"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arrow-Mobile-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7
